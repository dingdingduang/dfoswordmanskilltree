plugins {
	id 'fabric-loom' version '1.9-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name "KosmX's maven"
		url 'https://maven.kosmx.dev/'
	}

	maven {
		name = 'GeckoLib'
		url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
	}

	flatDir {
		dir 'libs'
	}

//	flatDir {
//		dirs "./.gradle/loom-cache/remapped_mods"
//	}

	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
//	annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	modImplementation 'software.bernie.geckolib:geckolib-fabric-1.18:3.0.80'
	modImplementation 'dev.kosmx.player-anim:player-animation-lib-fabric:1.0.2+1.18'

	if (file("libs").isDirectory()) {
		file("libs").eachFile { file ->
			def splitPos = file.name.lastIndexOf("-")

			if (file.name != "desktop.ini" && file.name != ".DS_Store") {
				println file.name

				def modartifact = file.name.substring(0, splitPos)
				def modversion = file.name.substring(splitPos + 1, file.name.length() - 4)
				def modreference = "lib:$modartifact:$modversion"

//				dependencies {
//					implementation (project.dependencies.create(modreference) {
//						transitive = false
//					})
//				}
				dependencies {
					modImplementation (project.dependencies.create(modreference) {
						transitive = false
					})

//					modCompileOnly name: file.name
//					modRuntime name: "your-dependency-@net.fabricmc.yarn.1_16_3.1.16.3+build.17-v2"
				}
			}
		}
	} else file("libs").mkdir()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}